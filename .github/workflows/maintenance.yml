name: Atlas Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

env:
  MAINTENANCE_START_UTC: "2026-08-21T02:00:00Z"
  MAINTENANCE_END_UTC: "2026-11-29T02:00:00Z"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check bounded maintenance window
        id: horizon
        shell: bash
        run: |
          now_epoch="$(date -u +%s)"
          start_epoch="$(date -u -d "${MAINTENANCE_START_UTC}" +%s)"
          end_epoch="$(date -u -d "${MAINTENANCE_END_UTC}" +%s)"
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "within_window=true" >> "$GITHUB_OUTPUT"
            echo "execution_number=manual" >> "$GITHUB_OUTPUT"
            echo "Manual validation does not consume a scheduled maintenance cycle."
          elif [[ "$now_epoch" -ge "$start_epoch" && "$now_epoch" -lt "$end_epoch" ]]; then
            execution_number="$(( (now_epoch - start_epoch) / 3600 + 1 ))"
            echo "within_window=true" >> "$GITHUB_OUTPUT"
            echo "execution_number=$execution_number" >> "$GITHUB_OUTPUT"
            echo "Scheduled maintenance cycle $execution_number is within the approved window."
          else
            echo "within_window=false" >> "$GITHUB_OUTPUT"
            echo "execution_number=expired" >> "$GITHUB_OUTPUT"
            echo "Maintenance horizon has ended; skipping scheduled validation."
          fi
      - uses: actions/checkout@v4
        if: steps.horizon.outputs.within_window == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.horizon.outputs.within_window == 'true'
      - uses: actions/setup-node@v4
        if: steps.horizon.outputs.within_window == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Run bounded maintenance validation
        id: validation
        if: steps.horizon.outputs.within_window == 'true'
        env:
          # GitHub-hosted runs do not receive personal Google Workspace sessions.
          # A selected account may opt into the same read-only check in a secure local runner.
          ATLAS_GWS_HEALTH_CHECK: "false"
        run: bash scripts/run-maintenance.sh
      - name: Write machine-readable execution record
        if: always()
        shell: bash
        run: |
          mkdir -p maintenance-record
          cat > maintenance-record/execution.json <<EOF
          {
            "schemaVersion": 1,
            "repository": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "runId": "${{ github.run_id }}",
            "runNumber": "${{ github.run_number }}",
            "trigger": "${{ github.event_name }}",
            "executionNumber": "${{ steps.horizon.outputs.execution_number }}",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "withinMaintenanceWindow": "${{ steps.horizon.outputs.within_window }}",
            "maintenanceStartUtc": "${{ env.MAINTENANCE_START_UTC }}",
            "maintenanceEndUtc": "${{ env.MAINTENANCE_END_UTC }}",
            "validationStatus": "${{ job.status }}",
            "googleWorkspaceHealth": "${{ steps.validation.outputs.google_workspace_health || 'not-executed' }}",
            "failureCategory": "none_or_recorded_in_workflow_logs",
            "recoveryAttempt": 0,
            "remainingBlocker": "Daily AI review time and Google Workspace account selection remain user-selected; deterministic maintenance has no implicit external actions.",
            "timestamp": "$(date --utc +%Y-%m-%dT%H:%M:%SZ)",
            "nextAction": "Inspect only failures or newly introduced alerts; run the Google Workspace check only after explicit account selection."
          }
          EOF
      - name: Upload maintenance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-maintenance-record-${{ github.run_id }}
          path: maintenance-record/execution.json
          retention-days: 180
